# Render Blueprint, free plan: the API server and the dashboard.
services:
  - type: web
    name: agenttrust-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest
      # Keeps the demo owner connected and the agent token stable across restarts.
      - key: DEMO_PAYMENT_TOKEN_ID
        sync: false
      - key: DEMO_AGENT_TOKEN
        sync: false
      - key: DATA_FILE
        value: /tmp/agenttrust-state.json

  - type: web
    name: agenttrust-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: web/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The server's host name, filled in by Render.
      - key: VITE_API_URL
        fromService:
          type: web
          name: agenttrust-server
          property: host
